name: Check Markdown links

on:
  push:
    paths:
      - '**/*.md' # Only run when markdown files change
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  workflow_dispatch: # Allows manual triggering

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: List Markdown files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # PRs check only the Markdown they add, change or rename.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | select(.status != "removed" and (.filename | endswith(".md"))) | .filename'
          else
            git ls-files '*.md'
          fi > md-files.txt

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --verbose --no-progress --root-dir ${{ github.workspace }} --files-from md-files.txt
          failIfEmpty: false

      - name: Create Issue If Failed
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const title = '🔗 Broken links found in documentation';
            const body = 'The link checker found broken links in the documentation. Please check the [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) for details.';

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'documentation,broken-links',
            });

            const issueExists = existingIssues.data.some(issue => issue.title === title);
            if (!issueExists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['documentation', 'broken-links']
              });
            }
